<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageSlime - Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            height: calc(100vh - 80px);
            width: 100vw;
            margin-top: 50px;
        }

        #sidebar {
            width: 280px;
            background: #16213e;
            padding: 20px;
            border-right: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #2a2a3a;
        }

        #main-canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
            touch-action: none;
        }

        #toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: #0f3460;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #1a4a7a;
            overflow-x: auto;
            z-index: 100;
        }

        #status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: #16213e;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85em;
            color: #888;
            border-top: 1px solid #0f3460;
            z-index: 100;
        }

        .section-title {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #0f3460;
            margin: 15px 0 10px;
            padding: 10px;
            border-bottom: 1px solid #0f3460;
        }

        #layers-list, #objects-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .layer-item, .object-item {
            padding: 10px;
            margin: 2px 0;
            background: #0f3460;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .layer-item:hover, .object-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .layer-item.active, .object-item.active {
            background: rgba(102, 126, 234, 0.15);
            border-color: #4a8ac2;
        }

        .layer-thumbnail, .object-thumbnail {
            width: 40px;
            height: 40px;
            background: #333;
            border-radius: 4px;
            margin-right: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .layer-name, .object-name {
            flex: 1;
            font-size: 0.9em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .layer-controls, .object-controls {
            display: flex;
            gap: 5px;
        }

        .layer-controls button, .object-controls button {
            background: transparent;
            border: none;
            color: #ccc;
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            transition: all 0.2s;
        }

        .layer-controls button:hover, .object-controls button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: #ccc;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
            font-size: 0.9em;
            white-space: nowrap;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .tool-btn.active {
            background: rgba(102, 126, 234, 0.2);
            color: #4a8ac2;
            border: 1px solid #4a8ac2;
        }

        #upload-btn {
            position: relative;
            overflow: hidden;
        }

        #upload-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .coords {
            color: #4a8ac2;
        }

        .context-menu {
            position: absolute;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 6px;
            padding: 5px 0;
            z-index: 1000;
            display: none;
            min-width: 180px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .context-menu.show {
            display: block;
        }

        .context-menu-item {
            padding: 8px 15px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .context-menu-item:hover {
            background: #0f3460;
            color: #fff;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #16213e;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #fff;
            font-size: 1.3em;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.2s;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #4a8ac2;
            color: #fff;
        }

        .btn-primary:hover {
            background: #5a9bd2;
        }

        .btn-secondary {
            background: #0f3460;
            color: #ccc;
            border: 1px solid #1a4a7a;
        }

        .btn-secondary:hover {
            background: #1a4a7a;
            color: #fff;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4a8ac2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #selection-rect {
            position: absolute;
            border: 2px dashed #4a8ac2;
            background: rgba(74, 138, 194, 0.1);
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        #selection-rect.show {
            display: block;
        }

        .upload-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .upload-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed #4a8ac2;
            border-radius: 10px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .upload-overlay.drag-over {
            pointer-events: auto;
        }

        .upload-overlay.drag-over {
            opacity: 1;
        }

        .upload-overlay .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
            color: #4a8ac2;
        }

        .upload-overlay .upload-text {
            font-size: 1.2em;
            color: #ccc;
            margin-bottom: 10px;
        }

        .upload-overlay .upload-hint {
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="sidebar">
            <div class="section-title">Layers</div>
            <div id="layers-list"></div>

            <div class="section-title">Objects</div>
            <div id="objects-list"></div>

            <div class="section-title">Tools</div>
            <div id="tools-list">
                <button class="tool-btn" onclick="setTool('select')" id="tool-select">
                    🖱️ Select
                </button>
                <button class="tool-btn" onclick="setTool('segment')" id="tool-segment">
                    ✂️ Segment
                </button>
                <button class="tool-btn" onclick="setTool('move')" id="tool-move">
                    🪃 Move
                </button>
                <button class="tool-btn" onclick="setTool('rotate')" id="tool-rotate">
                    🔄 Rotate
                </button>
                <button class="tool-btn" onclick="setTool('scale')" id="tool-scale">
                    📐 Scale
                </button>
            </div>
        </div>

        <div id="canvas-container">
            <canvas id="main-canvas"></canvas>
            <div id="selection-rect" class="selection-rect"></div>
            <div id="upload-overlay" class="upload-overlay">
                <div class="upload-icon">📁</div>
                <div class="upload-text">Drop images here</div>
                <div class="upload-hint">or click to browse</div>
            </div>
            <div id="context-menu" class="context-menu"></div>
        </div>
    </div>

    <div id="toolbar" style="position: fixed; top: 0; left: 0; right: 0; z-index: 100;">
        <label class="tool-btn" id="upload-btn" for="upload-input" style="margin-left: 20px;">
            📁 Upload
            <input type="file" id="upload-input" accept="image/*" multiple style="display: none;">
        </label>
        <button class="tool-btn" onclick="exportProject()">
            💾 Export
        </button>
        <button class="tool-btn" onclick="clearCanvas()">
            🗑️ Clear
        </button>
        <button class="tool-btn" onclick="undo()">
            ⬅️ Undo
        </button>
        <button class="tool-btn" onclick="redo()">
            ➡️ Redo
        </button>
    </div>

    <div id="zoom-controls" style="position: fixed; bottom: 30px; left: 20px; z-index: 100; display: flex; align-items: center; gap: 10px;">
        <span style="color: #ccc;">Zoom:</span>
        <input type="range" id="zoom-slider" min="0.1" max="3" step="0.1" value="1"
               style="width: 150px;"
               oninput="updateZoom(this.value)">
        <span id="zoom-value" style="color: #ccc;">100%</span>
        <button class="tool-btn" onclick="resetZoom()" style="padding: 5px 10px;">Reset</button>
    </div>

    <div id="status-bar">
        <span class="coords" id="mouse-coords">X: 0, Y: 0</span>
        <span id="status-message">Ready</span>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Title</h3>
            <div id="modal-body"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmModal()" id="modal-confirm">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Application state
        const state = {
            canvas: null,
            ctx: null,
            images: [],
            layers: [],
            objects: [],
            activeTool: 'select',
            activeLayer: null,
            activeObject: null,
            isDragging: false,
            dragStart: { x: 0, y: 0 },
            selectionRect: { start: null, end: null },
            scale: 1,
            offset: { x: 0, y: 0 },
            mousePos: { x: 0, y: 0 },
            history: [],
            historyIndex: -1,
            isDraggingFile: false,
            segmentationDragStart: null,
            // Segmentation state (multi-point with preview)
            isSegmenting: false,
            segmentationLayer: null,
            segmentationPoints: [],
            segmentationPreviewMask: null,
            segmentationPreviewBbox: null,
            segmentationPreviewImage: null,
            // Direct manipulation state
            activeLayer: null,
            dragStartLayerPos: null,
            // Object manipulation state
            isRotating: false,
            rotationStart: 0,
            isScaling: false,
            scaleStart: { x: 0, y: 0 },
            originalScale: [1, 1],
            // Z-index counter
            nextZIndex: 0
        };

        // Initialize application
        function init() {
            state.canvas = document.getElementById('main-canvas');
            state.ctx = state.canvas.getContext('2d');

            // Set canvas size
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Setup event listeners
            setupEventListeners();

            // Setup upload
            setupUpload();

            // Load any existing project
            loadProject();

            // Check SAM3 status
            checkSAM3Status();

            // Start render loop
            requestAnimationFrame(render);
        }

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            state.canvas.width = container.clientWidth;
            state.canvas.height = container.clientHeight;
            render();
        }

        function setupUpload() {
            // File input change handler
            const uploadInput = document.getElementById('upload-input');
            uploadInput.addEventListener('change', handleUpload);

            // Drag and drop setup
            const canvasContainer = document.getElementById('canvas-container');
            const uploadOverlay = document.getElementById('upload-overlay');

            // Drag enter
            canvasContainer.addEventListener('dragenter', function(e) {
                e.preventDefault();
                e.stopPropagation();
                state.isDraggingFile = true;
                uploadOverlay.classList.add('drag-over');
            });

            // Drag leave
            canvasContainer.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                state.isDraggingFile = false;
                uploadOverlay.classList.remove('drag-over');
            });

            // Drag over
            canvasContainer.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
            });

            // Drop
            canvasContainer.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                state.isDraggingFile = false;
                uploadOverlay.classList.remove('drag-over');

                // Handle dropped files
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleDroppedFiles(e.dataTransfer.files);
                }
            });

            // Click on upload label - handled by HTML for attribute

            // Click on upload overlay
            uploadOverlay.addEventListener('click', function(e) {
                e.preventDefault();
                uploadInput.click();
            });
        }

        function handleUpload(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            showStatus(`Uploading ${files.length} file(s)...`);

            for (let i = 0; i < files.length; i++) {
                uploadFile(files[i]);
            }

            // Reset input so we can upload the same file again
            e.target.value = '';
        }

        function handleDroppedFiles(files) {
            showStatus(`Uploading ${files.length} dropped file(s)...`);

            for (let i = 0; i < files.length; i++) {
                uploadFile(files[i]);
            }
        }

        function uploadFile(file) {
            // Validate file type
            const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
            if (!validTypes.includes(file.type) && !file.name.match(/\.(jpg|jpeg|png|webp|gif)$/i)) {
                showStatus(`Skipping ${file.name}: Invalid file type`, true);
                return;
            }

            // Validate file size (10MB max)
            if (file.size > 10 * 1024 * 1024) {
                showStatus(`Skipping ${file.name}: File too large (max 10MB)`, true);
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            fetch('/api/v1/images/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    // Create layer from uploaded image
                    const layer = {
                        id: data.image_id,
                        type: 'image',
                        name: file.name.replace(/\.[^\.]+$/, ''), // Remove extension
                        image_path: data.image_path,
                        image_base64: data.image_base64 || data.thumbnail_base64,
                        width: data.width,
                        height: data.height,
                        original_width: data.width,
                        original_height: data.height,
                        position: [100 + state.layers.length * 50, 100 + state.layers.length * 50],
                        rotation: 0,
                        scale: [1, 1],
                        opacity: 1,
                        visible: true,
                        z_index: state.nextZIndex++,
                        image_obj: null  // Will be loaded async
                    };

                    // Pre-load the image
                    const img = new Image();
                    img.onload = function() {
                        layer.image_obj = img;
                        render();
                    };
                    img.src = data.thumbnail_base64;

                    state.layers.push(layer);
                    state.activeLayer = layer;
                    updateLayersList();
                    saveHistory();
                    render();
                    showStatus(`Image uploaded: ${file.name}`);

                    // Pre-compute embeddings for faster segmentation
                    computeEmbeddings(data.image_id);
                } else {
                    showStatus(`Upload failed: ${data.message || 'Unknown error'}`, true);
                }
            })
            .catch(error => {
                showStatus(`Upload error: ${error.message}`, true);
                console.error('Upload error:', error);
            });
        }

        function computeEmbeddings(imageId) {
            fetch(`/api/v1/images/${imageId}/compute-embeddings`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus(`Embeddings computed for image: ${imageId}`);
                }
            })
            .catch(error => {
                console.error('Failed to compute embeddings:', error);
            });
        }

        function setupEventListeners() {
            // Mouse events
            state.canvas.addEventListener('mousedown', onMouseDown);
            state.canvas.addEventListener('mousemove', onMouseMove);
            state.canvas.addEventListener('mouseup', onMouseUp);
            state.canvas.addEventListener('mouseleave', onMouseLeave);
            state.canvas.addEventListener('wheel', onWheel);

            // Keyboard events
            document.addEventListener('keydown', onKeyDown);

            // Context menu
            state.canvas.addEventListener('contextmenu', onContextMenu);
        }

        function onMouseDown(e) {
            // If we're dragging a file, don't process mouse events
            if (state.isDraggingFile) return;

            const pos = getMousePos(e);
            state.mousePos = pos;
            updateMouseCoords(pos);

            // Check if we clicked on any layer (image or object) for direct dragging
            const clickedLayer = getLayerAtPosition(pos);
            const clickedObj = getObjectAtPosition(pos);
            const clickedItem = clickedLayer || clickedObj;

            // If we clicked on something and not using a specific tool, start dragging
            if (clickedItem && state.activeTool === 'select') {
                state.activeObject = clickedObj || null;
                state.activeLayer = clickedLayer || null;
                state.isDragging = true;
                state.dragStart = pos;
                if (clickedObj) {
                    state.dragStartObjPos = [clickedObj.position[0], clickedObj.position[1]];
                } else if (clickedLayer) {
                    state.dragStartLayerPos = [clickedLayer.position[0], clickedLayer.position[1]];
                }
                e.preventDefault();
                return;
            }

            switch (state.activeTool) {
                case 'select':
                    // Start selection rectangle
                    state.selectionRect.start = pos;
                    state.selectionRect.end = pos;
                    updateSelectionRect();
                    break;

                case 'segment':
                    // Check if we clicked on a layer
                    const segmentLayer = getLayerAtPosition(pos);
                    if (segmentLayer) {
                        // Calculate position relative to layer
                        const relX = pos.x - segmentLayer.position[0];
                        const relY = pos.y - segmentLayer.position[1];

                        // Start or add to multi-point segmentation
                        addSegmentationPoint(segmentLayer, relX, relY);
                        
                        // Set drag start for potential drag-to-finish
                        state.segmentationDragStart = pos;
                    } else {
                        showStatus('No image at this position', true);
                    }
                    break;

                case 'move':
                    // Check if we clicked on an object to move
                    const objToMove = getObjectAtPosition(pos);
                    if (objToMove) {
                        state.activeObject = objToMove;
                        state.isDragging = true;
                        state.dragStart = pos;
                        // Store original position for dragging
                        state.dragStartObjPos = [objToMove.position[0], objToMove.position[1]];
                    } else {
                        showStatus('No object at this position to move', true);
                    }
                    break;

                case 'rotate':
                    // Check if we clicked on an object to rotate
                    const objToRotate = getObjectAtPosition(pos);
                    if (objToRotate) {
                        state.activeObject = objToRotate;
                        state.isRotating = true;
                        state.rotationStart = objToRotate.rotation;
                        state.dragStart = pos;
                    } else {
                        showStatus('No object at this position to rotate', true);
                    }
                    break;

                case 'scale':
                    // Check if we clicked on an object or layer to scale
                    const objToScale = getObjectAtPosition(pos);
                    const layerToScale = getLayerAtPosition(pos);
                    const itemToScale = objToScale || layerToScale;

                    if (itemToScale) {
                        if (objToScale) {
                            state.activeObject = objToScale;
                            state.activeLayer = null;
                        } else {
                            state.activeLayer = layerToScale;
                            state.activeObject = null;
                        }
                        state.isScaling = true;
                        state.scaleStart = pos;
                        state.originalScale = [itemToScale.scale[0], itemToScale.scale[1]];
                    } else {
                        showStatus('No item at this position to scale', true);
                    }
                    break;

                default:
                    // Try to select object at this position
                    const objToSelect = getObjectAtPosition(pos);
                    if (objToSelect) {
                        state.activeObject = objToSelect;
                        render();
                    }
            }
        }

        // Multi-point segmentation with preview and merge
        function addSegmentationPoint(layer, relX, relY) {
            // Debug: log what's being passed
            console.log('addSegmentationPoint called with:', layer);
            console.log('layer.id:', layer?.id);
            console.log('layer.type:', layer?.type);
            console.log('Is in state.layers?', state.layers.find(l => l.id === layer?.id) !== undefined);
            console.log('Is in state.objects?', state.objects.find(o => o.id === layer?.id) !== undefined);

            // If layer is null or not in layers, don't proceed
            if (!layer || !state.layers.find(l => l.id === layer.id)) {
                showStatus('Cannot segment: layer not found', true);
                return;
            }

            // Additional check: ensure this is actually a layer, not an object
            // Objects have type 'object', layers have type 'image' or undefined
            if (layer.type === 'object') {
                showStatus('Cannot segment an object directly. Please click on the source image layer.', true);
                return;
            }

            // If clicking on a different layer, reset segmentation
            if (state.segmentationLayer !== layer) {
                state.segmentationLayer = layer;
                state.segmentationPoints = [];
                state.segmentationPreviewMask = null;
                state.segmentationPreviewBbox = null;
                state.segmentationPreviewImage = null;
                state.segmentationPreviewMaskImg = null;
                state.segmentationPreviewImg = null;
            }

            // Add new point
            state.segmentationPoints.push({ x: relX, y: relY });
            state.isSegmenting = true;

            // Request updated mask preview
            updateSegmentationPreview(layer);
        }

        function updateSegmentationPreview(layer) {
            if (state.segmentationPoints.length === 0) return;

            showStatus(`Segmenting... (${state.segmentationPoints.length} points - click more, drag to finish, or press Enter)`);

            // Debug: log layer info
            console.log('Segmentation: layer.id =', layer.id);
            console.log('Segmentation: layer.image_path =', layer.image_path);
            console.log('Segmentation: state.segmentationLayer =', state.segmentationLayer);
            console.log('Segmentation: state.layers =', state.layers.map(l => l.id));

            // Send all points to backend
            fetch('/api/v1/segmentation/points', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image_id: layer.id,
                    points: state.segmentationPoints,
                    labels: state.segmentationPoints.map(() => 1)  // All foreground
                })
            })
            .then(response => {
                if (!response.ok) {
                    console.error('Segmentation error: HTTP', response.status, response.statusText);
                    return response.json().then(err => {
                        console.error('Segmentation error details:', err);
                        throw new Error(err.detail || err.message || 'Segmentation failed');
                    });
                }
                return response.json();
            })
            .then(data => {
                if (data.success && data.cropped_image_base64) {
                    // Store preview
                    state.segmentationPreviewMask = data.mask_base64;
                    state.segmentationPreviewBbox = data.bounding_box;
                    state.segmentationPreviewImage = data.cropped_image_base64;

                    // Use the red preview mask from backend - always update on new data
                    if (data.preview_mask_base64) {
                        const maskImg = new Image();
                        maskImg.src = data.preview_mask_base64;
                        maskImg.onload = function() {
                            state.segmentationPreviewMaskImg = maskImg;
                            render();
                        };
                        state.segmentationPreviewMaskImg = maskImg;
                    }

                    // Pre-load preview image - always update on new data
                    const img = new Image();
                    img.onload = function() {
                        state.segmentationPreviewImg = img;
                        render();
                    };
                    img.src = data.cropped_image_base64;

                    render();
                    showStatus(`Segmentation preview (${state.segmentationPoints.length} points - click more or drag to finish)`);
                } else {
                    showStatus('Preview failed: ' + (data.message || 'Unknown error'), true);
                }
            })
            .catch(error => {
                console.error('Preview error:', error);
                let errorMsg = 'Preview error';
                if (error.message) {
                    errorMsg += ': ' + error.message;
                }
                if (error.response && error.response.status) {
                    errorMsg += ` (HTTP ${error.response.status})`;
                }
                showStatus(errorMsg, true);
            });
        }

        function finishSegmentation() {
            if (!state.isSegmenting || !state.segmentationLayer) return;

            const layer = state.segmentationLayer;
            const bbox = state.segmentationPreviewBbox;

            if (!bbox) {
                showStatus('No segmentation to finalize', true);
                return;
            }

            // Calculate center position
            const centerX = layer.position[0] + bbox.x1 + (bbox.x2 - bbox.x1) / 2;
            const centerY = layer.position[1] + bbox.y1 + (bbox.y2 - bbox.y1) / 2;

            // Create object
            const obj = {
                id: `obj_${Date.now()}`,
                name: `Object ${state.objects.length + 1}`,
                type: 'object',
                source_image_id: layer.id,
                source_image_path: layer.image_path,
                mask_base64: state.segmentationPreviewMask,
                cropped_image_base64: state.segmentationPreviewImage,
                bounding_box: bbox,
                position: [centerX, centerY],
                rotation: 0,
                scale: [1, 1],
                opacity: 1,
                visible: true,
                z_index: state.nextZIndex++,
                cropped_image: state.segmentationPreviewImg
            };

            state.objects.push(obj);
            state.activeObject = obj;
            saveHistory();
            updateLayersList();
            render();
            showStatus('Object created! Right-click to cut, copy, or delete.');

            // Reset segmentation state
            resetSegmentation();
        }

        function resetSegmentation() {
            state.isSegmenting = false;
            state.segmentationLayer = null;
            state.segmentationPoints = [];
            state.segmentationPreviewMask = null;
            state.segmentationPreviewBbox = null;
            state.segmentationPreviewImage = null;
            state.segmentationPreviewImg = null;
            state.segmentationPreviewMaskImg = null;
            state.segmentationDragStart = null;
            render();
        }

        // NEW: One-click segmentation (fallback)
        function createSegmentedObject(layer, relX, relY) {
            showStatus('Segmenting...');

            // Send single-point segmentation request
            fetch('/api/v1/segmentation/points', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image_id: layer.id,
                    points: [{ x: relX, y: relY }],
                    labels: [1]
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.cropped_image_base64) {
                    // Calculate position for new object (centered on click)
                    const bbox = data.bounding_box;
                    const objX = layer.position[0] + relX - (bbox.x2 - bbox.x1) / 2;
                    const objY = layer.position[1] + relY - (bbox.y2 - bbox.y1) / 2;

                    // Create new object layer
                    const obj = {
                        id: `obj_${Date.now()}`,
                        name: `Object ${state.objects.length + 1}`,
                        type: 'object',
                        source_image_id: layer.id,
                        source_image_path: layer.image_path,
                        mask_base64: data.mask_base64,
                        cropped_image_base64: data.cropped_image_base64,
                        bounding_box: bbox,
                        position: [objX, objY],
                        rotation: 0,
                        scale: [1, 1],
                        opacity: 1,
                        visible: true,
                        z_index: state.nextZIndex++,
                        cropped_image: null
                    };

                    // Pre-load the cropped image
                    const croppedImg = new Image();
                    croppedImg.src = data.cropped_image_base64;
                    croppedImg.onload = function() {
                        obj.cropped_image = croppedImg;
                        render();
                    };
                    obj.cropped_image = croppedImg;

                    // Add to objects
                    state.objects.push(obj);
                    state.activeObject = obj;
                    saveHistory();
                    updateLayersList();
                    render();
                    showStatus('Object created!');
                } else {
                    showStatus('Segmentation failed: ' + (data.message || 'Unknown error'), true);
                }
            })
            .catch(error => {
                showStatus('Segmentation error: ' + error.message, true);
                console.error('Segmentation error:', error);
            });
        }

        // OLD MULTI-POINT SYSTEM (removed)
        // OLD SEGMENTATION FUNCTIONS (deprecated)
        // Replaced with createSegmentedObject for one-click workflow
        // function segmentAtPoint(pos, layer) { ... }

        function onMouseMove(e) {
            const pos = getMousePos(e);
            state.mousePos = pos;
            updateMouseCoords(pos);

            if (state.isDragging) {
                // Handle dragging for both objects and layers
                const dx = pos.x - state.dragStart.x;
                const dy = pos.y - state.dragStart.y;

                if (state.activeObject) {
                    state.activeObject.position[0] += dx;
                    state.activeObject.position[1] += dy;
                } else if (state.activeLayer) {
                    state.activeLayer.position[0] += dx;
                    state.activeLayer.position[1] += dy;
                }
                state.dragStart = pos;
                render();

            } else if (state.isRotating && state.activeObject) {
                // Handle rotation
                const centerX = state.activeObject.position[0];
                const centerY = state.activeObject.position[1];
                const angle = calculateAngle(centerX, centerY, pos.x, pos.y);
                state.activeObject.rotation = state.rotationStart + angle;
                render();

            } else if (state.isScaling && (state.activeObject || state.activeLayer)) {
                // Handle scaling for both objects and layers
                const item = state.activeObject || state.activeLayer;
                const dx = pos.x - state.scaleStart.x;
                const dy = pos.y - state.scaleStart.y;
                const scaleFactor = 1 + (dx + dy) / 200; // Adjust sensitivity
                item.scale[0] = state.originalScale[0] * scaleFactor;
                item.scale[1] = state.originalScale[1] * scaleFactor;
                render();

            } else if (state.selectionRect.start && state.activeTool === 'select') {
                // Update selection rectangle
                state.selectionRect.end = pos;
                updateSelectionRect();
            }
        }

        function onMouseUp(e) {
            const pos = getMousePos(e);

            if (state.isDragging) {
                state.isDragging = false;
                saveHistory();
            } else if (state.isRotating) {
                state.isRotating = false;
                saveHistory();
            } else if (state.isScaling) {
                state.isScaling = false;
                saveHistory();
            }
            
            // Check for segmentation drag-to-finish
            if (state.isSegmenting && state.segmentationDragStart) {
                const dx = pos.x - state.segmentationDragStart.x;
                const dy = pos.y - state.segmentationDragStart.y;
                const dragDistance = Math.sqrt(dx * dx + dy * dy);
                
                if (dragDistance > 10) {
                    finishSegmentation();
                }
                
                state.segmentationDragStart = null;
            }

            if (state.selectionRect.start && state.activeTool === 'select') {
                // Complete selection
                state.selectionRect.end = pos;
                updateSelectionRect();

                // Check if we selected any objects
                const selected = getObjectsInRect(state.selectionRect);
                if (selected.length > 0) {
                    // For now, just select the first one
                    state.activeObject = selected[0];
                }

                // Clear selection rectangle
                state.selectionRect.start = null;
                state.selectionRect.end = null;
                updateSelectionRect();
            }
        }

        function onMouseLeave(e) {
            // Clear selection rectangle if we leave the canvas
            if (state.selectionRect.start) {
                state.selectionRect.start = null;
                state.selectionRect.end = null;
                updateSelectionRect();
            }
        }

        function onWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            state.scale = Math.max(0.1, Math.min(3, state.scale * delta));
            document.getElementById('zoom-slider').value = state.scale;
            document.getElementById('zoom-value').textContent = `${Math.round(state.scale * 100)}%`;
            render();
        }

        function onKeyDown(e) {
            // Handle keyboard shortcuts
            switch (e.key) {
                case 'Escape':
                    if (state.isSegmenting) {
                        resetSegmentation();
                    } else {
                        state.activeObject = null;
                        state.activeLayer = null;
                        state.activeTool = 'select';
                        updateToolButtons();
                        render();
                    }
                    break;

                case 'Enter':
                    if (state.isSegmenting) {
                        finishSegmentation();
                    }
                    break;

                case 'Delete':
                case 'Backspace':
                    if (state.activeObject) {
                        removeObject(state.activeObject);
                    } else if (state.activeLayer) {
                        removeLayer(state.activeLayer);
                    }
                    break;

                case 'c':
                case 'C':
                    // CMD+C or Ctrl+C: Copy selected item
                    if (e.metaKey || e.ctrlKey) {
                        e.preventDefault();
                        if (state.activeObject) {
                            copyItem(state.activeObject.id, 'object');
                        } else if (state.activeLayer) {
                            copyItem(state.activeLayer.id, 'layer');
                        }
                    }
                    // C key (without CMD/Ctrl): Cut selected object
                    else if (!e.altKey) {
                        e.preventDefault();
                        if (state.activeObject) {
                            cutItem(state.activeObject.id, 'object');
                        } else if (state.activeLayer) {
                            showStatus('Cannot cut a layer directly. Please segment an object first, then cut the object.', true);
                        } else {
                            showStatus('No item selected to cut.', true);
                        }
                    }
                    break;

                case 'x':
                    // CMD+X or Ctrl+X: Cut selected item (copy then delete AND remove from source)
                    if (e.metaKey || e.ctrlKey) {
                        e.preventDefault();
                        if (state.activeObject) {
                            cutItem(state.activeObject.id, 'object');
                        } else if (state.activeLayer) {
                            cutItem(state.activeLayer.id, 'layer');
                        }
                    }
                    break;

                case 'a':
                    // CMD+A or Ctrl+A: Select all
                    if (e.metaKey || e.ctrlKey) {
                        e.preventDefault();
                        // For now, just select the last object or layer
                        if (state.objects.length > 0) {
                            state.activeObject = state.objects[state.objects.length - 1];
                            state.activeLayer = null;
                        } else if (state.layers.length > 0) {
                            state.activeLayer = state.layers[state.layers.length - 1];
                            state.activeObject = null;
                        }
                        render();
                    }
                    break;

                case '1':
                    setTool('select');
                    break;
                case '2':
                    setTool('segment');
                    break;
                case '3':
                    setTool('move');
                    break;
                case '4':
                    setTool('rotate');
                    break;
                case '5':
                    setTool('scale');
                    break;
            }
        }

        function onContextMenu(e) {
            e.preventDefault();
            const pos = getMousePos(e);

            // Check if we clicked on an object first (objects are on top)
            const obj = getObjectAtPosition(pos);
            if (obj) {
                state.activeObject = obj;
                state.activeLayer = null;
                // Position context menu at click location
                showContextMenu(e.clientX, e.clientY, obj, 'object');
                return;
            }

            // Check if we clicked on a layer
            const layer = getLayerAtPosition(pos);
            if (layer) {
                state.activeLayer = layer;
                state.activeObject = null;
                // Position context menu at click location
                showContextMenu(e.clientX, e.clientY, layer, 'layer');
                return;
            }
        }

        function getMousePos(e) {
            const rect = state.canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left - state.offset.x) / state.scale,
                y: (e.clientY - rect.top - state.offset.y) / state.scale
            };
        }

        function calculateAngle(centerX, centerY, mouseX, mouseY) {
            // Calculate angle in degrees between center and mouse position
            const dx = mouseX - centerX;
            const dy = mouseY - centerY;
            return Math.atan2(dy, dx) * (180 / Math.PI);
        }

        function updateZoom(zoomLevel) {
            state.scale = parseFloat(zoomLevel);
            document.getElementById('zoom-value').textContent = `${Math.round(zoomLevel * 100)}%`;
            render();
        }

        function resetZoom() {
            state.scale = 1;
            state.offset = { x: 0, y: 0 };
            document.getElementById('zoom-slider').value = 1;
            document.getElementById('zoom-value').textContent = '100%';
            render();
        }

        function updateMouseCoords(pos) {
            document.getElementById('mouse-coords').textContent =
                `X: ${Math.round(pos.x)}, Y: ${Math.round(pos.y)}`;
        }

        function updateSelectionRect() {
            const rectEl = document.getElementById('selection-rect');
            if (state.selectionRect.start && state.selectionRect.end) {
                const start = state.selectionRect.start;
                const end = state.selectionRect.end;

                rectEl.style.left = `${Math.min(start.x, end.x) * state.scale + state.offset.x}px`;
                rectEl.style.top = `${Math.min(start.y, end.y) * state.scale + state.offset.y}px`;
                rectEl.style.width = `${Math.abs(end.x - start.x) * state.scale}px`;
                rectEl.style.height = `${Math.abs(end.y - start.y) * state.scale}px`;
                rectEl.style.display = 'block';
            } else {
                rectEl.style.display = 'none';
            }
        }

        function setTool(tool) {
            state.activeTool = tool;
            updateToolButtons();
            document.getElementById('status-message').textContent =
                `Tool: ${tool.charAt(0).toUpperCase() + tool.slice(1)}`;
        }

        function updateToolButtons() {
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`tool-${state.activeTool}`).classList.add('active');
        }

        function getLayerAtPosition(pos) {
            // Check layers in reverse order (top to bottom)
            console.log('getLayerAtPosition: checking', state.layers.length, 'layers');
            for (let i = state.layers.length - 1; i >= 0; i--) {
                const layer = state.layers[i];
                console.log('getLayerAtPosition: checking layer', layer.id, 'type:', layer.type);
                if (layer.visible && isPointInLayer(pos, layer)) {
                    console.log('getLayerAtPosition: FOUND layer', layer.id);
                    return layer;
                }
            }
            console.log('getLayerAtPosition: NO layer found at position', pos);
            return null;
        }

        function isPointInLayer(pos, layer) {
            // Check if point is within layer bounds, accounting for scale and rotation
            // Transform point into layer's local coordinate system

            // Translate point relative to layer position
            let localX = pos.x - layer.position[0];
            let localY = pos.y - layer.position[1];

            // Apply inverse rotation
            const angleRad = -layer.rotation * Math.PI / 180;
            const cosA = Math.cos(angleRad);
            const sinA = Math.sin(angleRad);
            const rotatedX = localX * cosA - localY * sinA;
            const rotatedY = localX * sinA + localY * cosA;

            // Apply inverse scale
            const scaledX = rotatedX / layer.scale[0];
            const scaledY = rotatedY / layer.scale[1];

            // Check if in original layer bounds
            return scaledX >= 0 && scaledX <= layer.width &&
                   scaledY >= 0 && scaledY <= layer.height;
        }

        function getObjectAtPosition(pos) {
            // Check objects in reverse order (top to bottom)
            for (let i = state.objects.length - 1; i >= 0; i--) {
                const obj = state.objects[i];
                if (obj.bounding_box && isPointInBox(pos, obj)) {
                    return obj;
                }
            }
            return null;
        }

        function isPointInBox(pos, obj) {
            if (!obj.bounding_box) return false;

            const bbox = obj.bounding_box;
            // Account for object's position, scale, and rotation
            // We need to transform the point into the object's local coordinate system

            // First, translate point relative to object position
            let localX = pos.x - obj.position[0];
            let localY = pos.y - obj.position[1];

            // Apply inverse rotation
            const angleRad = -obj.rotation * Math.PI / 180;
            const cosA = Math.cos(angleRad);
            const sinA = Math.sin(angleRad);
            const rotatedX = localX * cosA - localY * sinA;
            const rotatedY = localX * sinA + localY * cosA;

            // Apply inverse scale
            const scaledX = rotatedX / obj.scale[0];
            const scaledY = rotatedY / obj.scale[1];

            // Check if in bounding box (which is in object's local untransformed coordinates)
            return scaledX >= bbox.x1 && scaledX <= bbox.x2 &&
                   scaledY >= bbox.y1 && scaledY <= bbox.y2;
        }

        function getObjectsInRect(rect) {
            const minX = Math.min(rect.start.x, rect.end.x);
            const maxX = Math.max(rect.start.x, rect.end.x);
            const minY = Math.min(rect.start.y, rect.end.y);
            const maxY = Math.max(rect.start.y, rect.end.y);

            return state.objects.filter(obj => {
                if (!obj.bounding_box) return false;
                const bbox = obj.bounding_box;
                // Account for object's position
                const objX1 = obj.position[0] + bbox.x1;
                const objY1 = obj.position[1] + bbox.y1;
                const objX2 = obj.position[0] + bbox.x2;
                const objY2 = obj.position[1] + bbox.y2;
                return !(objX2 < minX || objX1 > maxX ||
                         objY2 < minY || objY1 > maxY);
            });
        }

        function removeObject(obj) {
            const index = state.objects.indexOf(obj);
            if (index > -1) {
                state.objects.splice(index, 1);
                if (state.activeObject === obj) {
                    state.activeObject = null;
                }
                saveHistory();
                render();
            }
        }

        function showContextMenu(x, y, item, type = 'object') {
            const menu = document.getElementById('context-menu');
            const itemId = item.id;

            // Determine if it's a layer or object
            const isLayer = type === 'layer';

            menu.innerHTML = `
                <div class="context-menu-item" onclick="bringToFront('${itemId}', '${type}')">Bring to Front</div>
                <div class="context-menu-item" onclick="sendToBack('${itemId}', '${type}')">Send to Back</div>
                <div class="context-menu-item" onclick="moveForward('${itemId}', '${type}')">Move Forward</div>
                <div class="context-menu-item" onclick="moveBackward('${itemId}', '${type}')">Move Backward</div>
                <div class="context-menu-item" onclick="cutItem('${itemId}', '${type}')">Cut</div>
                <div class="context-menu-item" onclick="copyItem('${itemId}', '${type}')">Copy</div>
                <div class="context-menu-item" onclick="deleteItem('${itemId}', '${type}')">Delete</div>
            `;

            // Get canvas container position to adjust coordinates
            const canvasContainer = document.getElementById('canvas-container');
            const rect = canvasContainer.getBoundingClientRect();

            // Adjust for canvas container offset and toolbar
            menu.style.left = `${x - rect.left}px`;
            menu.style.top = `${y - rect.top + 50}px`;  // +50 for toolbar height
            menu.classList.add('show');
        }

        function hideContextMenu() {
            document.getElementById('context-menu').classList.remove('show');
        }

        function bringToFront(itemId, type) {
            const allItems = [...state.layers, ...state.objects];
            const maxZ = Math.max(...allItems.map(i => i.z_index), 0);

            if (type === 'object') {
                const obj = state.objects.find(o => o.id === itemId);
                if (obj) {
                    obj.z_index = maxZ + 1;
                    state.nextZIndex = maxZ + 2;
                    render();
                    saveHistory();
                }
            } else if (type === 'layer') {
                const layer = state.layers.find(l => l.id === itemId);
                if (layer) {
                    layer.z_index = maxZ + 1;
                    state.nextZIndex = maxZ + 2;
                    render();
                    saveHistory();
                }
            }
            hideContextMenu();
        }

        function sendToBack(itemId, type) {
            const allItems = [...state.layers, ...state.objects];
            const minZ = Math.min(...allItems.map(i => i.z_index), 0);

            if (type === 'object') {
                const obj = state.objects.find(o => o.id === itemId);
                if (obj) {
                    obj.z_index = minZ - 1;
                    state.nextZIndex = Math.max(state.nextZIndex, minZ);
                    render();
                    saveHistory();
                }
            } else if (type === 'layer') {
                const layer = state.layers.find(l => l.id === itemId);
                if (layer) {
                    layer.z_index = minZ - 1;
                    state.nextZIndex = Math.max(state.nextZIndex, minZ);
                    render();
                    saveHistory();
                }
            }
            hideContextMenu();
        }

        function deleteItem(itemId, type) {
            if (type === 'object') {
                const obj = state.objects.find(o => o.id === itemId);
                if (obj) {
                    removeObject(obj);
                }
            } else if (type === 'layer') {
                const layer = state.layers.find(l => l.id === itemId);
                if (layer) {
                    removeLayer(layer);
                }
            }
            hideContextMenu();
        }

        function cutItem(itemId, type) {
            // Cut = copy then delete AND remove from source image
            const allItems = [...state.layers, ...state.objects];

            if (type === 'object') {
                const obj = state.objects.find(o => o.id === itemId);
                if (obj) {
                    // Find the source layer
                    const sourceLayer = state.layers.find(l => l.id === obj.source_image_id);

                    if (!sourceLayer) {
                        showStatus('Cannot cut: source layer not found', true);
                        hideContextMenu();
                        return;
                    }

                    if (sourceLayer && obj.mask_base64) {
                        // Call backend to cut from source image using the existing mask
                        showStatus('Cutting from source image...');

                        // Debug: log mask info
                        console.log('Cut: object mask_base64 length:', obj.mask_base64 ? obj.mask_base64.length : 0);
                        console.log('Cut: source_image_id:', obj.source_image_id);
                        console.log('Cut: bounding_box:', obj.bounding_box);

                        fetch('/api/v1/segmentation/cut', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                image_id: obj.source_image_id,
                                mask_base64: obj.mask_base64,
                                bounding_box: obj.bounding_box
                            })
                        })
                        .then(response => {
                            console.log('Cut: Response status:', response.status);
                            return response.json();
                        })
                        .then(data => {
                            console.log('Cut: Response data:', data);
                            if (data.success && data.image_base64) {
                                showStatus('Processing cut...');
                                console.log('Cut: Received image_base64, length:', data.image_base64.length);

                                // Update the source layer's image
                                console.log('Cut: Before update - sourceLayer.image_base64:', sourceLayer.image_base64 ? 'exists' : 'null');
                                sourceLayer.image_base64 = data.image_base64;
                                console.log('Cut: After update - sourceLayer.image_base64:', sourceLayer.image_base64 ? 'updated' : 'null');
                                // Update the image path to point to PNG version
                                if (sourceLayer.image_path && !sourceLayer.image_path.toLowerCase().endsWith('.png')) {
                                    sourceLayer.image_path = sourceLayer.image_path.replace(/\.[^.]+$/, '.png');
                                }
                                console.log('Cut: Updated sourceLayer.image_path:', sourceLayer.image_path);

                                // Create the copy first (before loading images)
                                const copy = JSON.parse(JSON.stringify(obj));
                                copy.id = `copy_${obj.id}_${Date.now()}`;
                                copy.position = [obj.position[0] + 20, obj.position[1] + 20];
                                copy.z_index = state.nextZIndex++;
                                copy.cropped_image = null;
                                copy.cropped_image_base64 = obj.cropped_image_base64;

                                let imagesLoaded = 0;
                                const totalImages = (data.image_base64 ? 1 : 0) + (copy.cropped_image_base64 ? 1 : 0);

                                // Reload the source layer image
                                if (data.image_base64) {
                                    const img = new Image();
                                    img.onload = function() {
                                        console.log('Cut: Source layer image loaded, width:', img.width, 'height:', img.height);
                                        sourceLayer.image_obj = img;
                                        imagesLoaded++;
                                        checkFinalizeCut();
                                    };
                                    img.onerror = function() {
                                        console.log('Cut: ERROR loading source layer image');
                                        showStatus('Error loading cut image', true);
                                        imagesLoaded++;
                                        checkFinalizeCut();
                                    };
                                    img.src = data.image_base64;
                                } else {
                                    imagesLoaded++;
                                }

                                // Load copy image if available
                                if (copy.cropped_image_base64) {
                                    const copyImg = new Image();
                                    copyImg.onload = function() {
                                        copy.cropped_image = copyImg;
                                        imagesLoaded++;
                                        checkFinalizeCut();
                                    };
                                    copyImg.onerror = function() {
                                        showStatus('Error loading copy image', true);
                                        imagesLoaded++;
                                        checkFinalizeCut();
                                    };
                                    copyImg.src = copy.cropped_image_base64;
                                } else {
                                    imagesLoaded++;
                                }

                                function checkFinalizeCut() {
                                    console.log('Cut: checkFinalizeCut - imagesLoaded:', imagesLoaded, 'totalImages:', totalImages);
                                    if (imagesLoaded === totalImages) {
                                        console.log('Cut: Finalizing - adding copy, removing original');
                                        // Add copy to objects
                                        state.objects.push(copy);
                                        state.activeObject = copy;

                                        // Delete the original
                                        removeObject(obj);

                                        saveHistory();
                                        updateLayersList();
                                        render();
                                        console.log('Cut: Render called');
                                        showStatus('Cut successful!');
                                    }
                                }

                                // If no images to load, finalize immediately
                                if (totalImages === 0) {
                                    checkFinalizeCut();
                                }

                                // Timeout fallback in case images never load
                                setTimeout(() => {
                                    if (imagesLoaded < totalImages) {
                                        showStatus('Cut completed but some images failed to load', true);
                                        checkFinalizeCut();
                                    }
                                }, 5000);
                            } else {
                                showStatus('Cut failed: ' + (data.message || 'Unknown error'), true);
                                // Still do the copy/delete even if backend failed
                                _fallbackCut(obj);
                            }
                        })
                        .catch(error => {
                            showStatus('Cut error: ' + error.message, true);
                            // Fallback to just copy/delete
                            _fallbackCut(obj);
                        });
                    } else {
                        // Fallback if no source layer or mask
                        _fallbackCut(obj);
                    }
                }
            } else if (type === 'layer') {
                // For layers, we can't really "cut" - show error
                showStatus('Cannot cut a layer directly. Please segment an object from the layer first, then cut the object.', true);
                hideContextMenu();
                return;
            }

            function _fallbackCut(item, itemType) {
                // Fallback: just copy and delete without modifying source
                if (itemType === 'object' || !itemType) {
                    const copy = JSON.parse(JSON.stringify(item));
                    copy.id = `copy_${item.id}_${Date.now()}`;
                    copy.position = [item.position[0] + 20, item.position[1] + 20];
                    copy.z_index = state.nextZIndex++;
                    copy.cropped_image = null;

                    if (copy.cropped_image_base64) {
                        const img = new Image();
                        img.onload = function() {
                            copy.cropped_image = img;
                            render();
                        };
                        img.src = copy.cropped_image_base64;
                    }

                    state.objects.push(copy);
                    state.activeObject = copy;
                    removeObject(item);
                } else if (itemType === 'layer') {
                    const copy = JSON.parse(JSON.stringify(item));
                    copy.id = `copy_${item.id}_${Date.now()}`;
                    copy.position = [item.position[0] + 20, item.position[1] + 20];
                    copy.z_index = state.nextZIndex++;
                    copy.image_obj = null;

                    if (copy.image_base64) {
                        const img = new Image();
                        img.onload = function() {
                            copy.image_obj = img;
                            render();
                        };
                        img.src = copy.image_base64;
                    }

                    state.layers.push(copy);
                    state.activeLayer = copy;
                    removeLayer(item);
                }

                saveHistory();
                updateLayersList();
                render();
                showStatus('Cut (source image unchanged)');
            }

            hideContextMenu();
        }

        function copyItem(itemId, type) {
            if (type === 'object') {
                const obj = state.objects.find(o => o.id === itemId);
                if (obj) {
                    const copy = JSON.parse(JSON.stringify(obj));
                    copy.id = `copy_${obj.id}_${Date.now()}`;
                    copy.position = [obj.position[0] + 20, obj.position[1] + 20];
                    copy.z_index = state.nextZIndex++;
                    copy.cropped_image = null;  // Reset - will be re-loaded

                    // Re-load the cropped image
                    if (copy.cropped_image_base64) {
                        const img = new Image();
                        img.onload = function() {
                            copy.cropped_image = img;
                            render();
                        };
                        img.src = copy.cropped_image_base64;
                    }

                    state.objects.push(copy);
                    state.activeObject = copy;
                    saveHistory();
                    updateLayersList();
                    render();
                }
            } else if (type === 'layer') {
                const layer = state.layers.find(l => l.id === itemId);
                if (layer) {
                    const copy = JSON.parse(JSON.stringify(layer));
                    copy.id = `copy_${layer.id}_${Date.now()}`;
                    copy.position = [layer.position[0] + 20, layer.position[1] + 20];
                    copy.z_index = state.nextZIndex++;
                    copy.image_obj = null;  // Reset - will be re-loaded

                    // Re-load the image
                    if (copy.image_base64) {
                        const img = new Image();
                        img.onload = function() {
                            copy.image_obj = img;
                            render();
                        };
                        img.src = copy.image_base64;
                    }

                    state.layers.push(copy);
                    state.activeLayer = copy;
                    saveHistory();
                    updateLayersList();
                    render();
                }
            }
            hideContextMenu();
        }

        function removeLayer(layer) {
            const index = state.layers.indexOf(layer);
            if (index > -1) {
                state.layers.splice(index, 1);
                if (state.activeLayer === layer) {
                    state.activeLayer = null;
                }
                saveHistory();
                render();
                updateLayersList();
            }
        }

        function moveForward(itemId, type) {
            const allItems = [...state.layers, ...state.objects];

            // Find the item
            let item = null;
            if (type === 'object') {
                item = state.objects.find(o => o.id === itemId);
            } else if (type === 'layer') {
                item = state.layers.find(l => l.id === itemId);
            }

            if (item) {
                // Sort all items by z-index
                const sortedItems = [...allItems].sort((a, b) => a.z_index - b.z_index);
                const currentIndex = sortedItems.findIndex(i => i.id === item.id);

                if (currentIndex < sortedItems.length - 1) {
                    // Find the next item in the sorted list
                    const nextItem = sortedItems[currentIndex + 1];

                    // Swap z-indexes
                    const tempZ = item.z_index;
                    item.z_index = nextItem.z_index;
                    nextItem.z_index = tempZ;
                } else {
                    // Already at the top, move to front
                    const maxZ = Math.max(...allItems.map(i => i.z_index), 0);
                    item.z_index = maxZ + 1;
                    state.nextZIndex = maxZ + 2;
                }

                render();
                saveHistory();
                updateLayersList();
            }
            hideContextMenu();
        }

        function moveBackward(itemId, type) {
            const allItems = [...state.layers, ...state.objects];

            // Find the item
            let item = null;
            if (type === 'object') {
                item = state.objects.find(o => o.id === itemId);
            } else if (type === 'layer') {
                item = state.layers.find(l => l.id === itemId);
            }

            if (item) {
                // Sort all items by z-index
                const sortedItems = [...allItems].sort((a, b) => a.z_index - b.z_index);
                const currentIndex = sortedItems.findIndex(i => i.id === item.id);

                if (currentIndex > 0) {
                    // Find the previous item in the sorted list
                    const prevItem = sortedItems[currentIndex - 1];

                    // Swap z-indexes
                    const tempZ = item.z_index;
                    item.z_index = prevItem.z_index;
                    prevItem.z_index = tempZ;
                } else {
                    // Already at the bottom, move to back
                    const minZ = Math.min(...allItems.map(i => i.z_index), 0);
                    item.z_index = minZ - 1;
                    state.nextZIndex = Math.max(state.nextZIndex, minZ);
                }

                render();
                saveHistory();
                updateLayersList();
            }
            hideContextMenu();
        }

        function updateLayersList() {
            const listEl = document.getElementById('layers-list');

            // Combine and sort all items by z-index (back to front)
            const allItems = [...state.layers, ...state.objects].sort((a, b) => a.z_index - b.z_index);

            listEl.innerHTML = allItems.map(item => {
                const isLayer = item.type === 'image' || !item.type;
                const isActive = isLayer ? state.activeLayer === item : state.activeObject === item;
                const thumbnail = isLayer ? item.image_base64 : item.cropped_image_base64;
                const name = item.name || (isLayer ? 'Image' : 'Object');

                return `
                <div class="layer-item ${isActive ? 'active' : ''}"
                     onclick="${isLayer ? `selectLayer('${item.id}')` : `selectObject('${item.id}')`}">
                    <img src="${thumbnail || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><rect width=%2240%22 height=%2240%22 fill=%22%23333%22/></svg>'}"
                         class="layer-thumbnail" alt="${name}">
                    <span class="layer-name">${name} ${isLayer ? '' : '(obj)'}</span>
                    <div class="layer-controls">
                        <button onclick="event.stopPropagation(); toggleVisibility('${item.id}', '${isLayer ? 'layer' : 'object'}')">
                            ${item.visible ? '👁️' : '👁️‍🗨'}
                        </button>
                        <button onclick="event.stopPropagation(); deleteItem('${item.id}', '${isLayer ? 'layer' : 'object'}')">🗑️</button>
                    </div>
                </div>
            `;}).join('');
        }

        function selectLayer(layerId) {
            state.activeLayer = state.layers.find(l => l.id === layerId);
            state.activeObject = null;
            updateLayersList();
            render();
        }

        function selectObject(objId) {
            state.activeObject = state.objects.find(o => o.id === objId);
            state.activeLayer = null;
            updateLayersList();
            render();
        }

        function toggleVisibility(itemId, type) {
            if (type === 'layer') {
                const layer = state.layers.find(l => l.id === itemId);
                if (layer) {
                    layer.visible = !layer.visible;
                    updateLayersList();
                    render();
                }
            } else if (type === 'object') {
                const obj = state.objects.find(o => o.id === itemId);
                if (obj) {
                    obj.visible = !obj.visible;
                    updateLayersList();
                    render();
                }
            }
        }

        function deleteLayer(layerId) {
            const index = state.layers.findIndex(l => l.id === layerId);
            if (index > -1) {
                state.layers.splice(index, 1);
                if (state.activeLayer && state.activeLayer.id === layerId) {
                    state.activeLayer = null;
                }
                updateLayersList();
                saveHistory();
                render();
            }
        }

        function render() {
            // Clear canvas
            state.ctx.fillStyle = '#1a1a2e';
            state.ctx.fillRect(0, 0, state.canvas.width, state.canvas.height);

            // Apply scale and offset
            state.ctx.save();
            state.ctx.scale(state.scale, state.scale);
            state.ctx.translate(state.offset.x / state.scale, state.offset.y / state.scale);

            // Combine all items and sort by z-index (back to front)
            const allItems = [...state.layers, ...state.objects].sort((a, b) => a.z_index - b.z_index);

            // Draw all items in z-index order
            for (const item of allItems) {
                if (!item.visible) continue;

                if (item.type === 'object' || item.cropped_image_base64) {
                    drawObject(item);
                } else {
                    drawLayer(item);
                }
            }

            // Draw segmentation preview (if segmenting)
            if (state.isSegmenting && state.segmentationPreviewImg && state.segmentationLayer) {
                drawSegmentationPreview();
            }

            // Draw active item highlight
            if (state.activeObject) {
                drawObjectHighlight(state.activeObject);
            } else if (state.activeLayer) {
                drawLayerHighlight(state.activeLayer);
            }

            state.ctx.restore();
        }

        function drawLayerHighlight(layer) {
            if (!layer.width || !layer.height) return;

            state.ctx.save();
            state.ctx.translate(layer.position[0], layer.position[1]);
            state.ctx.rotate(layer.rotation * Math.PI / 180);
            state.ctx.scale(layer.scale[0], layer.scale[1]);

            // Draw highlight
            state.ctx.strokeStyle = '#ffff00';
            state.ctx.lineWidth = 3;
            state.ctx.setLineDash([5, 5]);
            state.ctx.strokeRect(0, 0, layer.width, layer.height);
            state.ctx.setLineDash([]);

            state.ctx.restore();
        }

        function drawSegmentationPreview() {
            if (!state.segmentationPreviewMaskImg || !state.segmentationLayer || !state.segmentationPreviewBbox) return;

            const layer = state.segmentationLayer;
            const bbox = state.segmentationPreviewBbox;

            state.ctx.save();
