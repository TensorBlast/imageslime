            state.ctx.translate(layer.position[0], layer.position[1]);
            state.ctx.rotate(layer.rotation * Math.PI / 180);
            state.ctx.scale(layer.scale[0], layer.scale[1]);

            // Draw the red preview mask at the bounding box position
            // The preview mask is already cropped to bbox dimensions, so draw at bbox origin
            state.ctx.drawImage(state.segmentationPreviewMaskImg, bbox.x1, bbox.y1);

            state.ctx.restore();
        }

        function drawLayer(layer) {
            // Apply layer transformations
            state.ctx.save();
            state.ctx.translate(layer.position[0], layer.position[1]);
            state.ctx.scale(layer.scale[0], layer.scale[1]);
            state.ctx.rotate(layer.rotation * Math.PI / 180);
            state.ctx.globalAlpha = layer.opacity;

            // Draw the image if available
            if (layer.image_base64) {
                // Check if image is already loaded
                if (layer.image_obj && layer.image_obj.complete) {
                    state.ctx.drawImage(layer.image_obj, 0, 0, layer.width, layer.height);
                } else {
                    // Draw placeholder while loading
                    state.ctx.fillStyle = 'rgba(100, 100, 255, 0.3)';
                    state.ctx.fillRect(0, 0, layer.width, layer.height);

                    // Load image async
                    const img = new Image();
                    img.onload = function() {
                        layer.image_obj = img;
                        render();
                    };
                    img.src = layer.image_base64;
                }
            } else {
                // Draw placeholder
                state.ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                state.ctx.fillRect(0, 0, layer.width, layer.height);
            }

            state.ctx.globalAlpha = 1.0;
            state.ctx.restore();

            // Draw layer name (not transformed)
            state.ctx.save();
            state.ctx.translate(layer.position[0], layer.position[1]);
            state.ctx.fillStyle = '#4a8ac2';
            state.ctx.font = '12px Arial';
            state.ctx.fillText(layer.name, 5, 15);
            state.ctx.restore();
        }

        function drawObject(obj) {
            if (!obj.cropped_image_base64 && !obj.mask_base64) return;

            // Apply object transformations
            state.ctx.save();
            state.ctx.translate(obj.position[0], obj.position[1]);
            state.ctx.rotate(obj.rotation * Math.PI / 180);
            state.ctx.scale(obj.scale[0], obj.scale[1]);

            // Draw the cropped image (with transparency)
            if (obj.cropped_image && obj.cropped_image.complete && obj.bounding_box) {
                const bbox = obj.bounding_box;
                state.ctx.globalAlpha = obj.opacity;
                state.ctx.drawImage(
                    obj.cropped_image,
                    bbox.x1, bbox.y1,
                    bbox.x2 - bbox.x1,
                    bbox.y2 - bbox.y1
                );
                state.ctx.globalAlpha = 1.0;
            } else if (obj.bounding_box) {
                // Fallback: draw bounding box if image not loaded yet
                const bbox = obj.bounding_box;
                state.ctx.fillStyle = 'rgba(255, 107, 107, 0.3)';
                state.ctx.fillRect(
                    bbox.x1, bbox.y1,
                    bbox.x2 - bbox.x1,
                    bbox.y2 - bbox.y1
                );
            }

            state.ctx.restore();
        }

        function drawObjectHighlight(obj) {
            if (!obj.bounding_box) return;

            const bbox = obj.bounding_box;

            state.ctx.save();
            state.ctx.translate(obj.position[0], obj.position[1]);
            state.ctx.rotate(obj.rotation * Math.PI / 180);
            state.ctx.scale(obj.scale[0], obj.scale[1]);

            // Draw highlight
            state.ctx.strokeStyle = '#ffff00';
            state.ctx.lineWidth = 3;
            state.ctx.setLineDash([5, 5]);
            state.ctx.strokeRect(
                bbox.x1 - 5, bbox.y1 - 5,
                bbox.x2 - bbox.x1 + 10,
                bbox.y2 - bbox.y1 + 10
            );
            state.ctx.setLineDash([]);

            state.ctx.restore();
        }

        // OLD PREVIEW FUNCTIONS (deprecated - one-click doesn't need preview)
        // function drawSegmentationPreview() { ... }
        // function drawSegmentationPoints() { ... }

        function saveHistory() {
            // Save current state to history
            const currentState = {
                layers: JSON.parse(JSON.stringify(state.layers)),
                objects: JSON.parse(JSON.stringify(state.objects))
            };

            // If we're not at the end of history, truncate
            if (state.historyIndex < state.history.length - 1) {
                state.history = state.history.slice(0, state.historyIndex + 1);
            }

            state.history.push(currentState);
            state.historyIndex = state.history.length - 1;

            // Limit history size
            if (state.history.length > 50) {
                state.history.shift();
                state.historyIndex--;
            }
        }

        function undo() {
            if (state.historyIndex > 0) {
                state.historyIndex--;
                const prevState = state.history[state.historyIndex];
                state.layers = JSON.parse(JSON.stringify(prevState.layers));
                state.objects = JSON.parse(JSON.stringify(prevState.objects));
                state.activeObject = null;
                updateLayersList();
                render();
            }
        }

        function redo() {
            if (state.historyIndex < state.history.length - 1) {
                state.historyIndex++;
                const nextState = state.history[state.historyIndex];
                state.layers = JSON.parse(JSON.stringify(nextState.layers));
                state.objects = JSON.parse(JSON.stringify(nextState.objects));
                state.activeObject = null;
                updateLayersList();
                render();
            }
        }

        function clearCanvas() {
            if (confirm('Are you sure you want to clear the canvas?')) {
                state.layers = [];
                state.objects = [];
                state.activeLayer = null;
                state.activeObject = null;
                state.history = [];
                state.historyIndex = -1;
                updateLayersList();
                render();
                showStatus('Canvas cleared');
            }
        }

        function exportProject() {
            showStatus('Exporting...');

            // Get all visible items (layers and objects)
            const allItems = [...state.layers, ...state.objects]
                .filter(item => item.visible)
                .sort((a, b) => a.z_index - b.z_index);

            if (allItems.length === 0) {
                showStatus('Nothing to export', true);
                return;
            }

            // Calculate the minimum bounding box that contains all items
            let minX = Infinity, minY = Infinity;
            let maxX = -Infinity, maxY = -Infinity;

            for (const item of allItems) {
                // Calculate the transformed bounding box for this item
                const itemBounds = getItemBounds(item);
                minX = Math.min(minX, itemBounds.minX);
                minY = Math.min(minY, itemBounds.minY);
                maxX = Math.max(maxX, itemBounds.maxX);
                maxY = Math.max(maxY, itemBounds.maxY);
            }

            // If no bounds found (shouldn't happen), use a default size
            if (minX === Infinity) {
                minX = minY = 0;
                maxX = maxY = 100;
            }

            // Calculate canvas size
            const width = Math.ceil(maxX - minX);
            const height = Math.ceil(maxY - minY);

            // Create a temporary canvas for export with transparent background
            const exportCanvas = document.createElement('canvas');
            const exportCtx = exportCanvas.getContext('2d');

            exportCanvas.width = width;
            exportCanvas.height = height;

            // Clear with transparent background
            exportCtx.clearRect(0, 0, width, height);

            // Draw all visible items onto the export canvas
            // We need to translate each item by the offset to fit in the bounding box
            for (const item of allItems) {
                exportCtx.save();

                // Translate item to be relative to the bounding box origin
                exportCtx.translate(item.position[0] - minX, item.position[1] - minY);
                exportCtx.rotate(item.rotation * Math.PI / 180);
                exportCtx.scale(item.scale[0], item.scale[1]);
                exportCtx.globalAlpha = item.opacity;

                if (item.type === 'object' || item.cropped_image_base64) {
                    // Draw object
                    if (item.cropped_image && item.cropped_image.complete && item.bounding_box) {
                        const bbox = item.bounding_box;
                        exportCtx.drawImage(
                            item.cropped_image,
                            bbox.x1, bbox.y1,
                            bbox.x2 - bbox.x1,
                            bbox.y2 - bbox.y1
                        );
                    }
                } else if (item.image_obj && item.image_obj.complete) {
                    // Draw layer
                    exportCtx.drawImage(
                        item.image_obj,
                        0, 0, item.width, item.height
                    );
                }

                exportCtx.globalAlpha = 1.0;
                exportCtx.restore();
            }

            // Convert to blob and download as PNG (which supports transparency)
            exportCanvas.toBlob(function(blob) {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `imageslime_export_${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                showStatus('Export complete!');
            }, 'image/png');
        }

        function getItemBounds(item) {
            // Calculate the bounding box of an item after all transformations
            // This is a simplified approximation - we calculate the corners

            let corners = [];

            if (item.type === 'object' && item.bounding_box) {
                // For objects, use their bounding box
                const bbox = item.bounding_box;
                corners = [
                    { x: bbox.x1, y: bbox.y1 },
                    { x: bbox.x2, y: bbox.y1 },
                    { x: bbox.x2, y: bbox.y2 },
                    { x: bbox.x1, y: bbox.y2 }
                ];
            } else {
                // For layers, use their dimensions
                corners = [
                    { x: 0, y: 0 },
                    { x: item.width, y: 0 },
                    { x: item.width, y: item.height },
                    { x: 0, y: item.height }
                ];
            }

            // Apply scale
            for (const corner of corners) {
                corner.x *= item.scale[0];
                corner.y *= item.scale[1];
            }

            // Apply rotation
            const angleRad = item.rotation * Math.PI / 180;
            const cosA = Math.cos(angleRad);
            const sinA = Math.sin(angleRad);

            for (const corner of corners) {
                const rotatedX = corner.x * cosA - corner.y * sinA;
                const rotatedY = corner.x * sinA + corner.y * cosA;
                corner.x = rotatedX;
                corner.y = rotatedY;
            }

            // Apply translation (position)
            for (const corner of corners) {
                corner.x += item.position[0];
                corner.y += item.position[1];
            }

            // Find min/max
            let minX = Infinity, minY = Infinity;
            let maxX = -Infinity, maxY = -Infinity;

            for (const corner of corners) {
                minX = Math.min(minX, corner.x);
                minY = Math.min(minY, corner.y);
                maxX = Math.max(maxX, corner.x);
                maxY = Math.max(maxY, corner.y);
            }

            return { minX, minY, maxX, maxY };
        }

        function checkSAM3Status() {
            fetch('/api/v1/segmentation/model-info')
                .then(response => response.json())
                .then(data => {
                    if (data.model_info && data.model_info.available) {
                        showStatus('SAM3 model ready!');
                    } else {
                        showStatus('SAM3 model not available', true);
                    }
                })
                .catch(error => {
                    showStatus('Failed to check SAM3 status', true);
                });
        }

        function showStatus(message, isError = false) {
            const statusEl = document.getElementById('status-message');
            statusEl.textContent = message;
            statusEl.style.color = isError ? '#ff6b6b' : '#4a8ac2';
        }

        function loadProject() {
            // Try to load the last saved project
            fetch('/api/v1/project/list')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.projects && data.projects.length > 0) {
                        // Load the most recent project
                        const latest = data.projects.reduce((a, b) =>
                            new Date(a.updated_at) > new Date(b.updated_at) ? a : b);

                        return fetch(`/api/v1/project/load?filepath=${encodeURIComponent(latest.filepath)}`);
                    }
                    return Promise.resolve({});
                })
                .then(response => {
                    if (response && response.ok) {
                        return response.json();
                    }
                    return {};
                })
                .then(data => {
                    if (data.success && data.project) {
                        // Load project data
                        state.layers = data.project.image_layers || [];
                        state.objects = data.project.segmented_objects || [];
                        updateLayersList();
                        render();
                        showStatus(`Project loaded: ${data.project.name}`);
                    }
                })
                .catch(error => {
                    console.error('Failed to load project:', error);
                });
        }

        // Modal functions
        function showModal(title, content, confirmText = 'OK') {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = content;
            document.getElementById('modal-confirm').textContent = confirmText;
            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        function confirmModal() {
            closeModal();
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
